<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boldspil</title>
<style>
  body { margin: 0; background: #1b1f3b; color: white; font-family: sans-serif;
         display: flex; flex-direction: column; align-items: center;
         overscroll-behavior: none; }
  h1 { margin: 12px 0 4px; }
  canvas { background: #0e1126; border: 3px solid #ffcc33; border-radius: 8px;
           touch-action: none; box-sizing: border-box;
           /* Skaler så hele banen altid kan ses – også på en mobil */
           width: auto; height: auto;
           max-width: calc(100vw - 16px); max-height: calc(100vh - 110px); }
  p { opacity: 0.8; margin: 6px 16px; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<h1>Boldspil</h1>
<canvas id="spil" width="480" height="640"></canvas>
<p>Flyt skiven med musen, fingeren eller piletasterne. Tryk MELLEMRUM eller klik for at starte.</p>

<script>
// ============================================================
//  INDSTILLINGER – prøv at ændre tallene her og se hvad der sker!
// ============================================================
const START_FART      = 4;     // Hvor hurtigt bolden starter
const FART_OEGNING    = 1.08;  // Bolden bliver 8% hurtigere ved hvert hit
const MAX_FART        = 16;    // Bolden kan ikke blive hurtigere end dette
const SKIVE_BREDDE    = 100;   // Hvor bred skiven er
const SKIVE_FART      = 8;     // Hvor hurtigt skiven flytter sig med piletasterne
const BOLD_STOERRELSE = 12;    // Boldens radius
const LIV             = 1;     // 1 = forfra ved første miss. Prøv 3!
const POINT_FOR_SEJR  = 100;   // Hvor mange point der skal til for at vinde
const HITS_TIL_MAX    = 25;    // Efter så mange hits er loftet helt vildt
const RING_HVER       = 5;     // Nye ringe for hvert 5. hit
const LILLE_RING_POINT = 10;   // Point for at skyde gennem den lille ring
const STOR_RING_POINT  = 5;    // Point for at skyde gennem den store ring
const BOLD_FARVE      = "#ff5577";
const SKIVE_FARVE     = "#33ddff";
const LOFT_FARVE      = "#ffcc33";
const LOFT_HOEJDE     = 95;    // Hvor langt nede loftet ligger (i midten)
const LOFT_MIN_BOELGE = 4;     // Hvor store bølgerne er i starten
const LOFT_MAX_BOELGE = 38;    // Hvor store bølgerne kan blive til sidst

// ============================================================
//  SELVE SPILLET
// ============================================================
const canvas = document.getElementById("spil");
const tegn = canvas.getContext("2d");
const B = canvas.width, H = canvas.height;

let skive, bold, point, hits, liv, tilstand;
let ringe = [], flydeTekst = []; // tilstand: "klar", "spiller", "tabt", "vundet"
let rekord = 0;
const taster = {};

// ---------- Det bølgede loft ----------
// Loftet er en række punkter fra venstre til højre. Mellem punkterne er der lige streger.
// "loft" er det man ser nu, "loftMaal" er den form loftet langsomt glider over i.
const LOFT_PUNKTER = 48;
let loft = [], loftMaal = [];

function lavLoft(svaerhed) {
  // svaerhed går fra 0 (starten) til 1 (lige før man vinder)
  const boelge = LOFT_MIN_BOELGE + (LOFT_MAX_BOELGE - LOFT_MIN_BOELGE) * svaerhed;

  // 1) Bløde bølger: en sinus-kurve med tilfældig forskydning
  const faseA = Math.random() * 6.28, faseB = Math.random() * 6.28;
  // 2) Kantede takker: få tilfældige punkter forbundet med lige streger
  const takker = [];
  const antalTakker = 4 + Math.round(svaerhed * 8);
  for (let i = 0; i <= antalTakker; i++) takker.push(Math.random() * 2 - 1);

  const nyt = [];
  for (let i = 0; i <= LOFT_PUNKTER; i++) {
    const t = i / LOFT_PUNKTER;              // 0 i venstre side, 1 i højre side
    const blød = 0.7 * Math.sin(t * 6.28 * 2 + faseA) + 0.3 * Math.sin(t * 6.28 * 3 + faseB);
    const pos = t * antalTakker, j = Math.floor(pos), rest = pos - j;
    const kantet = takker[j] + (takker[Math.min(j + 1, antalTakker)] - takker[j]) * rest;
    // Jo sværere, jo mere kantet og mindre blødt
    const form = blød * (1 - svaerhed) + kantet * svaerhed;
    nyt.push({ x: t * B, y: LOFT_HOEJDE + form * boelge });
  }
  return nyt;
}

function loftY(x) {
  // Hvor ligger loftet lige over x?
  const pos = Math.max(0, Math.min(LOFT_PUNKTER - 0.001, x / B * LOFT_PUNKTER));
  const i = Math.floor(pos), rest = pos - i;
  return loft[i].y + (loft[i + 1].y - loft[i].y) * rest;
}

function hopPaaLoft() {
  // Find den del af loftet, der er tættest på bolden
  let bedst = null;
  for (let i = 0; i < LOFT_PUNKTER; i++) {
    const a = loft[i], b = loft[i + 1];
    if (b.x < bold.x - bold.r - 20 || a.x > bold.x + bold.r + 20) continue;
    const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
    const t = Math.max(0, Math.min(1, ((bold.x - a.x) * dx + (bold.y - a.y) * dy) / len2));
    const px = a.x + dx * t, py = a.y + dy * t;
    const afstand = Math.hypot(bold.x - px, bold.y - py);
    if (!bedst || afstand < bedst.afstand) bedst = { afstand, dx, dy };
  }
  const underLoftet = bold.y < loftY(bold.x);  // Er bolden smuttet op igennem?
  if (!bedst || (bedst.afstand > bold.r && !underLoftet)) return;

  // Normalen er den retning, stregen "peger" (nedad, ind i banen)
  const len = Math.hypot(bedst.dx, bedst.dy);
  const nx = -bedst.dy / len, ny = bedst.dx / len;
  const ind = bold.vx * nx + bold.vy * ny;
  if (ind < 0) {
    // Spejl farten i stregen – ligesom lys i et spejl
    bold.vx -= 2 * ind * nx;
    bold.vy -= 2 * ind * ny;
  }
  // Sørg for at bolden altid flyver nedad bagefter (ellers kan den sidde fast)
  const fart = Math.hypot(bold.vx, bold.vy);
  if (bold.vy < fart * 0.35) {
    bold.vy = fart * 0.35;
    bold.vx = Math.sign(bold.vx || 1) * Math.sqrt(fart * fart - bold.vy * bold.vy);
  }
  // Skub bolden ud af loftet
  bold.y = Math.max(bold.y, loftY(bold.x) + bold.r);
}

// ---------- Ringene ----------
// En ring er et hul med en "kant" (en lille kugle) i hver ende.
// Igennem hullet = point. Rammer man kanten = bolden preller af.
const KANT = 5; // Kantens radius

function lavRinge() {
  const d = BOLD_STOERRELSE * 2;               // Boldens diameter
  const lilleVenstre = Math.random() < 0.5;    // Hvilken side får den lille ring?
  ringe = [
    lavRing(d * 3, LILLE_RING_POINT, "#7dff8a", lilleVenstre),
    lavRing(d * 5, STOR_RING_POINT,  "#c58bff", !lilleVenstre),
  ];
}

function lavRing(hul, vaerdi, farve, venstre) {
  const halv = hul / 2 + KANT;
  const plads = 40;                            // Plads til pointtallet ved siden af
  const min = venstre ? halv + 8 : B / 2 + plads + halv;
  const max = venstre ? B / 2 - plads - halv : B - halv - 8;
  return {
    x: min + Math.random() * (max - min),
    y: H / 3 + (Math.random() * 40 - 20),      // Ca. 2/3 oppe på skærmen
    halv, hul, vaerdi, farve, venstre,
    synlig: 0,                                 // Bruges til at fade ringen ind
  };
}

function ringeKollision(forrigeY) {
  for (const ring of ringe) {
    // 1) Rammer bolden en af de to kanter?
    for (const side of [-1, 1]) {
      const kx = ring.x + side * ring.halv, ky = ring.y;
      const dx = bold.x - kx, dy = bold.y - ky;
      const afstand = Math.hypot(dx, dy);
      if (afstand < bold.r + KANT && afstand > 0) {
        const nx = dx / afstand, ny = dy / afstand;
        const ind = bold.vx * nx + bold.vy * ny;
        if (ind < 0) { bold.vx -= 2 * ind * nx; bold.vy -= 2 * ind * ny; } // Spejl farten
        // Skub bolden ud, så den ikke hænger fast i kanten
        bold.x = kx + nx * (bold.r + KANT);
        bold.y = ky + ny * (bold.r + KANT);
        // Undgå at bolden flyver helt vandret
        const fart = Math.hypot(bold.vx, bold.vy);
        if (Math.abs(bold.vy) < fart * 0.25) {
          bold.vy = Math.sign(bold.vy || 1) * fart * 0.25;
          bold.vx = Math.sign(bold.vx || 1) * Math.sqrt(fart * fart - bold.vy * bold.vy);
        }
      }
    }
    // 2) Er bolden fløjet igennem hullet? (den har krydset ringens højde mellem kanterne)
    const krydsede = (forrigeY - ring.y) * (bold.y - ring.y) <= 0 && forrigeY !== bold.y;
    if (krydsede && Math.abs(bold.x - ring.x) < ring.hul / 2) {
      point += ring.vaerdi;
      flydeTekst.push({ x: ring.x, y: ring.y, tekst: "+" + ring.vaerdi, farve: ring.farve, tid: 60 });
      ring.vaek = true;
      if (point >= POINT_FOR_SEJR) slut("vundet");
    }
  }
  ringe = ringe.filter(r => !r.vaek);
}

function nytSpil() {
  skive = { x: B / 2 - SKIVE_BREDDE / 2, y: H - 40, b: SKIVE_BREDDE, h: 14 };
  point = 0;
  hits = 0;
  ringe = [];
  flydeTekst = [];
  liv = LIV;
  loft = lavLoft(0);
  loftMaal = loft;
  nyBold();
  tilstand = "klar";
}

function nyBold() {
  // Bolden starter i toppen og falder skråt ned
  const retning = Math.random() < 0.5 ? -1 : 1;
  bold = { x: B / 2, y: LOFT_HOEJDE + LOFT_MAX_BOELGE + 40, vx: retning * START_FART * 0.6, vy: START_FART, r: BOLD_STOERRELSE };
}

function start() {
  if (tilstand === "klar") tilstand = "spiller";
  else if (tilstand === "tabt" || tilstand === "vundet") nytSpil();
}

// ---------- Styring ----------
document.addEventListener("keydown", e => {
  taster[e.key] = true;
  if (e.key === " ") { start(); e.preventDefault(); }
});
document.addEventListener("keyup", e => { taster[e.key] = false; });

function flytTilPointer(e) {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (B / r.width);
  skive.x = Math.max(0, Math.min(B - skive.b, x - skive.b / 2));
}
canvas.addEventListener("pointermove", flytTilPointer);
canvas.addEventListener("pointerdown", e => { flytTilPointer(e); start(); });

// ---------- Opdater (sker ca. 60 gange i sekundet) ----------
function opdater() {
  if (taster["ArrowLeft"])  skive.x = Math.max(0, skive.x - SKIVE_FART);
  if (taster["ArrowRight"]) skive.x = Math.min(B - skive.b, skive.x + SKIVE_FART);

  if (tilstand !== "spiller") return;

  // Loftet glider stille og roligt over i sin nye form
  for (let i = 0; i <= LOFT_PUNKTER; i++) loft[i].y += (loftMaal[i].y - loft[i].y) * 0.05;

  // Flyt bolden i små skridt, så den ikke smutter igennem loftet når den er hurtig
  const skridt = Math.ceil(Math.hypot(bold.vx, bold.vy) / 4);
  for (let s = 0; s < skridt; s++) {
    const forrigeY = bold.y;
    bold.x += bold.vx / skridt;
    bold.y += bold.vy / skridt;

    // Hop på sidevæggene
    if (bold.x - bold.r < 0) { bold.x = bold.r; bold.vx = Math.abs(bold.vx); }
    if (bold.x + bold.r > B) { bold.x = B - bold.r; bold.vx = -Math.abs(bold.vx); }
    // Hop på det bølgede loft
    if (bold.y - bold.r < LOFT_HOEJDE + LOFT_MAX_BOELGE + 5) hopPaaLoft();
    // Ringe
    ringeKollision(forrigeY);
    if (tilstand !== "spiller") return;
  }

  // Ringene fader ind, og point-teksten flyver op og forsvinder
  for (const ring of ringe) ring.synlig = Math.min(1, ring.synlig + 0.05);
  for (const f of flydeTekst) { f.y -= 1; f.tid--; }
  flydeTekst = flydeTekst.filter(f => f.tid > 0);

  // Rammer bolden skiven?
  if (bold.vy > 0 &&
      bold.y + bold.r >= skive.y && bold.y + bold.r <= skive.y + skive.h + bold.vy &&
      bold.x >= skive.x - bold.r && bold.x <= skive.x + skive.b + bold.r) {
    hits++;
    point++;
    // Hvor på skiven ramte den? (-1 = venstre kant, 0 = midten, 1 = højre kant)
    const hvor = (bold.x - (skive.x + skive.b / 2)) / (skive.b / 2);
    const fart = Math.min(MAX_FART, Math.hypot(bold.vx, bold.vy) * FART_OEGNING);
    const vinkel = hvor * 1.0; // op til ca. 57 grader til siden
    bold.vx = fart * Math.sin(vinkel);
    bold.vy = -fart * Math.cos(vinkel);
    bold.y = skive.y - bold.r;
    // Loftet skifter form – og bliver vildere jo flere point man har
    loftMaal = lavLoft(Math.min(1, hits / HITS_TIL_MAX));
    // For hvert 5. hit kommer der nye ringe
    if (hits % RING_HVER === 0) lavRinge();
    if (point >= POINT_FOR_SEJR) slut("vundet");
  }

  // Missede bolden?
  if (bold.y - bold.r > H) {
    liv--;
    if (liv <= 0) slut("tabt");
    else { nyBold(); tilstand = "klar"; }
  }
}

function slut(resultat) {
  tilstand = resultat;
  rekord = Math.max(rekord, point);
}

// ---------- Tegn ----------
function tekst(t, y, str = 28) {
  tegn.font = `bold ${str}px sans-serif`;
  tegn.textAlign = "center";
  tegn.fillText(t, B / 2, y);
}

function tegnRing(ring, del) {
  tegn.globalAlpha = ring.synlig;
  tegn.strokeStyle = ring.farve;
  tegn.lineWidth = KANT * 2;
  tegn.lineCap = "round";
  tegn.beginPath();
  // Ringen er en flad ellipse – som en basketkurv set lidt fra siden
  if (del === "bag") tegn.ellipse(ring.x, ring.y, ring.halv, 10, 0, Math.PI, Math.PI * 2);
  else               tegn.ellipse(ring.x, ring.y, ring.halv, 10, 0, 0, Math.PI);
  tegn.stroke();
  if (del === "for") {
    // Pointtallet ud for ringen (på den side der vender ind mod midten)
    tegn.fillStyle = ring.farve;
    tegn.font = "bold 20px sans-serif";
    tegn.textAlign = ring.venstre ? "left" : "right";
    const tx = ring.x + (ring.venstre ? ring.halv + 10 : -ring.halv - 10);
    tegn.fillText(ring.vaerdi, tx, ring.y + 7);
  }
  tegn.globalAlpha = 1;
}

function tegnAlt() {
  tegn.clearRect(0, 0, B, H);

  // Loft: fyld området over stregen og tegn selve kanten
  tegn.beginPath();
  tegn.moveTo(0, 0);
  for (const p of loft) tegn.lineTo(p.x, p.y);
  tegn.lineTo(B, 0);
  tegn.closePath();
  tegn.fillStyle = "#2a2f5c";
  tegn.fill();
  tegn.beginPath();
  loft.forEach((p, i) => i ? tegn.lineTo(p.x, p.y) : tegn.moveTo(p.x, p.y));
  tegn.strokeStyle = LOFT_FARVE;
  tegn.lineWidth = 3;
  tegn.stroke();

  // Skive
  tegn.fillStyle = SKIVE_FARVE;
  tegn.fillRect(skive.x, skive.y, skive.b, skive.h);

  // Ringe: den bageste halvdel tegnes FØR bolden, den forreste EFTER,
  // så det ser ud som om bolden flyver igennem ringen
  for (const ring of ringe) tegnRing(ring, "bag");

  // Bold
  tegn.fillStyle = BOLD_FARVE;
  tegn.beginPath();
  tegn.arc(bold.x, bold.y, bold.r, 0, Math.PI * 2);
  tegn.fill();

  for (const ring of ringe) tegnRing(ring, "for");

  // Point der flyver op når man rammer en ring
  tegn.font = "bold 26px sans-serif";
  tegn.textAlign = "center";
  for (const f of flydeTekst) {
    tegn.globalAlpha = f.tid / 60;
    tegn.fillStyle = f.farve;
    tegn.fillText(f.tekst, f.x, f.y);
  }
  tegn.globalAlpha = 1;

  // Point, liv og fart
  tegn.fillStyle = "white";
  tegn.font = "bold 20px sans-serif";
  tegn.textAlign = "left";
  tegn.fillText(`Point: ${point} / ${POINT_FOR_SEJR}`, 12, 28);
  tegn.textAlign = "right";
  tegn.fillText("❤".repeat(liv), B - 12, 28);
  tegn.textAlign = "left";
  tegn.font = "14px sans-serif";
  tegn.fillText(`Hits: ${hits}   Fart: ${Math.hypot(bold.vx, bold.vy).toFixed(1)}   Rekord: ${rekord}`, 12, 50);

  // Beskeder
  tegn.fillStyle = "#ffcc33";
  if (tilstand === "klar")   tekst("Tryk for at starte", H / 2);
  if (tilstand === "tabt")   { tekst("GAME OVER", H / 2 - 20, 40); tekst(`Du fik ${point} point`, H / 2 + 20, 24); tekst("Tryk for at prøve igen", H / 2 + 60, 20); }
  if (tilstand === "vundet") { tekst("DU VANDT! 🏆", H / 2 - 20, 40); tekst("Tryk for at spille igen", H / 2 + 30, 20); }
}

function loop() {
  opdater();
  tegnAlt();
  requestAnimationFrame(loop);
}

nytSpil();
loop();
</script>
</body>
</html>
